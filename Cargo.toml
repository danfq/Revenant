[package]
name = "revenant"
version = "0.1.0"
edition = "2021"
description = "Recover deleted, hidden and purged photos from an encrypted iOS backup"
license = "AGPL-3.0-only"
readme = "README.md"

[[bin]]
name = "revenant"
path = "src/main.rs"

[workspace]
members = ["crates/core", "gui/src-tauri"]
default-members = [".", "crates/core"]
resolver = "2"

[dependencies]
revenant-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
